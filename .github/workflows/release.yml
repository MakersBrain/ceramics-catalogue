name: Immutable Catalogue release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build, certify staging evidence, or promote to production
        required: true
        type: choice
        options: [build, certify-staging, promote-production]
      compatible_makersbrain_release:
        description: Exact compatible control release ID (build only)
        required: false
        type: string
      staging_release_artifact:
        description: Immutable release artifact (certification and promotion)
        required: false
        type: string
      staging_evidence_artifact:
        description: Immutable evidence artifact emitted by staging (certification)
        required: false
        type: string
      staging_qualification_artifact:
        description: Immutable signed qualification artifact (promotion)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: catalogue-immutable-release
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.OCI_REGISTRY }}
  REPOSITORY_PREFIX: ${{ vars.CATALOGUE_OCI_REPOSITORY_PREFIX }}

jobs:
  build:
    if: inputs.operation == 'build'
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: read, id-token: write, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with: { cosign-release: v3.0.6 }
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - name: Fetch release signing material through Infisical OIDC
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          domain: ${{ vars.INFISICAL_DOMAIN }}
          identity-id: ${{ vars.INFISICAL_RELEASE_IDENTITY_ID }}
          oidc-audience: makersbrain-release
          project-slug: makersbrain-infra
          env-slug: staging
          secret-path: /image
          recursive: false
      - name: Authenticate to the controlled registry
        run: printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - name: Build once, scan, sign, and publish the release record
        env:
          COMPATIBLE_RELEASE: ${{ inputs.compatible_makersbrain_release }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$COMPATIBLE_RELEASE" in control-????.??.??-????????????????*) ;; *) echo "invalid compatible release" >&2; exit 1 ;; esac
          test -n "$COSIGN_PRIVATE_KEY"
          test -n "$COSIGN_PUBLIC_KEY"
          mkdir -p release/sbom release/vulnerability
          printf '{}\n' > release/images.json
          npmrc=$(mktemp)
          trap 'rm -f "$npmrc"' EXIT
          printf '@makersbrain:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NPM_TOKEN" > "$npmrc"

          record_image() {
            name=$1 immutable=$2
            syft "$immutable" -o "spdx-json=release/sbom/$name.spdx.json"
            trivy image --ignore-unfixed --format json --output "release/vulnerability/$name.json" "$immutable"
            trivy image --ignore-unfixed --exit-code 1 --severity CRITICAL "$immutable"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$immutable"
            jq --arg name "$name" --arg image "$immutable" '. + {($name): $image}' release/images.json > release/images.next.json
            mv release/images.next.json release/images.json
          }
          build_image() {
            name=$1 context=$2 dockerfile=$3 target=${4:-}
            tag="$REGISTRY/$REPOSITORY_PREFIX/$name:$GITHUB_SHA"
            args=(--platform linux/amd64 --file "$dockerfile" --secret "id=npmrc,src=$npmrc" --tag "$tag" --push)
            [ -z "$target" ] || args+=(--target "$target")
            docker buildx build "${args[@]}" "$context"
            digest=$(docker buildx imagetools inspect "$tag" --raw | sha256sum | cut -d' ' -f1)
            record_image "$name" "$REGISTRY/$REPOSITORY_PREFIX/$name@sha256:$digest"
          }

          build_image worker . docker/worker/Dockerfile worker
          build_image worker_browser . docker/worker/Dockerfile worker-browser
          build_image control . docker/control/Dockerfile
          build_image service . catalogue-service/Dockerfile
          build_image explorer catalogue-explorer catalogue-explorer/Dockerfile
          build_image database_transfer . docker/database-transfer/Dockerfile
          source=$(jq -er .nats .github/release-third-party-images.json)
          tag="$REGISTRY/$REPOSITORY_PREFIX/nats:$GITHUB_SHA"
          docker buildx imagetools create --tag "$tag" "$source"
          digest=$(docker buildx imagetools inspect "$tag" --raw | sha256sum | cut -d' ' -f1)
          record_image nats "$REGISTRY/$REPOSITORY_PREFIX/nats@sha256:$digest"

          jq -e 'length == 7' release/images.json >/dev/null
          release_id="catalogue-$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:16}"
          jq -n --arg release_id "$release_id" --arg source_commit "$GITHUB_SHA" \
            --arg ci_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg compatible "$COMPATIBLE_RELEASE" --slurpfile images release/images.json \
            '{release_id:$release_id,source_commit:$source_commit,ci_run_url:$ci_run_url,environment:"staging",staging_qualification_ref:"",compatible_makersbrain_release:$compatible,images:$images[0]}' \
            > release/release-record.json
          jq -n --arg compatible "$COMPATIBLE_RELEASE" --slurpfile images release/images.json \
            '{environment:"staging",compatible_makersbrain_release:$compatible,postgres_host:"10.40.2.20",postgres_port:5432,postgres_database:"ateliera",images:$images[0],worker_instances:[1,2]}' \
            > release/podman-values.json
          printf '%s\n' "$COSIGN_PUBLIC_KEY" > release/release-cosign.pub
          cosign sign-blob --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
            --output-signature release/release-record.json.sig release/release-record.json
          tar -C release -czf release/sbom.tar.gz sbom
          tar -C release -czf release/vulnerability.tar.gz vulnerability
          artifact="$REGISTRY/$REPOSITORY_PREFIX/releases:$release_id"
          oras push "$artifact" --artifact-type application/vnd.makersbrain.catalogue.release.v1+json \
            release/release-record.json:application/json release/release-record.json.sig:application/octet-stream \
            release/release-cosign.pub:application/x-pem-file release/podman-values.json:application/json \
            release/sbom.tar.gz:application/gzip release/vulnerability.tar.gz:application/gzip
          printf '%s@%s\n' "$REGISTRY/$REPOSITORY_PREFIX/releases" "$(oras resolve "$artifact")" > release/artifact-reference.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "catalogue-release-${{ github.sha }}", path: release/, retention-days: 30 }

  certify-staging:
    if: inputs.operation == 'certify-staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions: { contents: read, id-token: write, packages: write }
    steps:
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with: { cosign-release: v3.0.6 }
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          domain: ${{ vars.INFISICAL_DOMAIN }}
          identity-id: ${{ vars.INFISICAL_RELEASE_IDENTITY_ID }}
          oidc-audience: makersbrain-release
          project-slug: makersbrain-infra
          env-slug: staging
          secret-path: /image
          recursive: false
      - name: Authenticate and sign staging evidence binding
        env:
          RELEASE_ARTIFACT: ${{ inputs.staging_release_artifact }}
          EVIDENCE_ARTIFACT: ${{ inputs.staging_evidence_artifact }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          case "$RELEASE_ARTIFACT" in "$REGISTRY/$REPOSITORY_PREFIX/releases@sha256:"*) ;; *) exit 1 ;; esac
          case "$EVIDENCE_ARTIFACT" in "$REGISTRY/$REPOSITORY_PREFIX/staging-evidence@sha256:"*) ;; *) exit 1 ;; esac
          mkdir release qualification
          oras pull --output release "$RELEASE_ARTIFACT"
          printf '%s\n' "$COSIGN_PUBLIC_KEY" > qualification/release-cosign.pub
          cosign verify-blob --insecure-ignore-tlog --key qualification/release-cosign.pub --signature release/release-record.json.sig release/release-record.json
          jq -e '.environment == "staging" and .staging_qualification_ref == ""' release/release-record.json >/dev/null
          release_id=$(jq -r .release_id release/release-record.json)
          qualification_id="${release_id}-qualified-${GITHUB_RUN_ID}"
          jq -n --arg id "$qualification_id" --arg release "$RELEASE_ARTIFACT" --arg evidence "$EVIDENCE_ARTIFACT" \
            --arg release_id "$release_id" --arg created_at "$(date -u +%FT%TZ)" \
            '{qualification_id:$id,release_id:$release_id,release_artifact:$release,evidence_artifact:$evidence,result:"passed",created_at:$created_at}' \
            > qualification/staging-qualification.json
          cosign sign-blob --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY --output-signature qualification/staging-qualification.json.sig qualification/staging-qualification.json
          artifact="$REGISTRY/$REPOSITORY_PREFIX/qualifications:$qualification_id"
          oras push "$artifact" --artifact-type application/vnd.makersbrain.catalogue.qualification.v1+json \
            qualification/staging-qualification.json:application/json qualification/staging-qualification.json.sig:application/octet-stream
          printf '%s@%s\n' "$REGISTRY/$REPOSITORY_PREFIX/qualifications" "$(oras resolve "$artifact")"

  promote-production:
    if: inputs.operation == 'promote-production'
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write, packages: write }
    steps:
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with: { cosign-release: v3.0.6 }
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          domain: ${{ vars.INFISICAL_DOMAIN }}
          identity-id: ${{ vars.INFISICAL_PRODUCTION_RELEASE_IDENTITY_ID }}
          oidc-audience: makersbrain-release
          project-slug: makersbrain-infra
          env-slug: prod
          secret-path: /image
          recursive: false
      - name: Verify staging qualification and publish production record
        env:
          RELEASE_ARTIFACT: ${{ inputs.staging_release_artifact }}
          QUALIFICATION_ARTIFACT: ${{ inputs.staging_qualification_artifact }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | oras login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          case "$RELEASE_ARTIFACT" in "$REGISTRY/$REPOSITORY_PREFIX/releases@sha256:"*) ;; *) exit 1 ;; esac
          case "$QUALIFICATION_ARTIFACT" in "$REGISTRY/$REPOSITORY_PREFIX/qualifications@sha256:"*) ;; *) exit 1 ;; esac
          mkdir release qualification production
          oras pull --output release "$RELEASE_ARTIFACT"
          oras pull --output qualification "$QUALIFICATION_ARTIFACT"
          printf '%s\n' "$COSIGN_PUBLIC_KEY" > production/release-cosign.pub
          cosign verify-blob --insecure-ignore-tlog --key production/release-cosign.pub --signature release/release-record.json.sig release/release-record.json
          cosign verify-blob --insecure-ignore-tlog --key production/release-cosign.pub --signature qualification/staging-qualification.json.sig qualification/staging-qualification.json
          jq -e --arg release "$RELEASE_ARTIFACT" '.result == "passed" and .release_artifact == $release' qualification/staging-qualification.json >/dev/null
          jq --arg qualification "$QUALIFICATION_ARTIFACT" '.environment="production" | .staging_qualification_ref=$qualification' release/release-record.json > production/release-record.json
          jq '.environment="production" | .postgres_host="10.40.3.10"' release/podman-values.json > production/podman-values.json
          cosign sign-blob --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY --output-signature production/release-record.json.sig production/release-record.json
          release_id=$(jq -r .release_id production/release-record.json)
          artifact="$REGISTRY/$REPOSITORY_PREFIX/production-releases:$release_id"
          oras push "$artifact" --artifact-type application/vnd.makersbrain.catalogue.production-release.v1+json \
            production/release-record.json:application/json production/release-record.json.sig:application/octet-stream \
            production/release-cosign.pub:application/x-pem-file production/podman-values.json:application/json
          printf '%s@%s\n' "$REGISTRY/$REPOSITORY_PREFIX/production-releases" "$(oras resolve "$artifact")"
