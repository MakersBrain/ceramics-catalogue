# Lint, types, contracts and tests for the ceramics catalogue pipeline.
#
# Four jobs rather than one, because they answer different questions and fail
# for different reasons. `check` is fast and runs on every push. `postgres`
# needs a database. `golden` replays ten thousand recorded responses to prove
# the collection output has not moved, which takes minutes and is the thing the
# refactor is checked against.
#
# Every path here is relative to the repository root, which is also the project
# root. It was not always: this file was written against a monorepo layout that
# put the project under a `catalogue-ceramics/` subdirectory, and carried a
# `defaults.run.working-directory` and a set of `paths:` filters to match. No
# such directory exists. The filters therefore matched no file, so the push
# trigger never fired, and the image builds could not resolve their context --
# the workflow had never completed a single run.
name: catalogue-ceramics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-ceramics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, contracts and unit tests
    runs-on: ubuntu-latest
    # The explorer's brand package lives in GitHub Packages, which npm cannot
    # reach anonymously even for a package in the same org as this repository.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in requires-python, and the version the project is
        # developed on. A `type` statement or a 3.12-only builtin would pass
        # locally and break the image, so the floor is exercised rather than
        # asserted.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: catalogue-explorer/package-lock.json
      - name: Authenticate to GitHub Packages
        run: npm config set --location=user //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync every project
        run: |
          for project in catalogue-dump catalogue-control catalogue-service; do
            uv --directory "$project" sync --all-groups --python ${{ matrix.python }}
          done
          cd catalogue-explorer && npm ci
      - run: make lint
      - run: make typecheck
      - run: make test
      # Never hand-edit a generated OpenAPI document. This is what stops
      # "regenerate it later" from becoming "the spec is six months old".
      - name: Check the generated contracts have not drifted
        run: make openapi-check

  postgres:
    name: Queue, edges, run closure and the control API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Sync
        run: |
          uv --directory catalogue-dump sync --all-groups
          uv --directory catalogue-control sync --all-groups
      - name: Run the database-backed suites
        run: make test-postgres
        env:
          # These drop and recreate the `catalogue` schema, so this must be a
          # database nothing else is using. A CI service container is.
          PGTEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  golden:
    name: Replay the recorded catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The response cache is large and stored with Git LFS. Without it the
          # golden tests skip rather than fail, which would make a missing cache
          # look like a passing build.
          lfs: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: catalogue-dump/uv.lock
      - name: Sync
        run: uv --directory catalogue-dump sync --all-groups
      - name: Replay every cached source
        run: make test-golden
      - name: Keep the differing output for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-replay-diff
          path: /tmp/golden-*/
          if-no-files-found: ignore

  images:
    name: Build the images
    runs-on: ubuntu-latest
    # The explorer image installs @makersbrain/brand from GitHub Packages, which
    # npm cannot reach anonymously even for a package in this repository's own
    # organisation. The other three images are Python and need nothing.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built but not pushed: this proves the Dockerfiles still work against the
      # current source, which a compose file alone does not.
      - name: Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker/Dockerfile
          target: worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Browser worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker/Dockerfile
          target: worker-browser
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Control
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/control/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Read API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: catalogue-service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Database transfer tool
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/database-transfer/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The explorer was the one image nothing built, and it is the one with a
      # build that can fail on its own: the other three install from PyPI, this
      # one needs a credential for GitHub Packages. A broken secret mount or an
      # unpublished brand version would have surfaced at deploy time rather than
      # here.
      #
      # The credential is written to a file rather than passed with `secrets:`
      # because the Dockerfile mounts it at `/root/.npmrc`, so what the secret
      # has to contain is a whole npmrc, not a token. `secret-files` keeps the
      # multi-line value out of the workflow's argument list.
      - name: Write an npmrc for the explorer build
        run: |
          printf '@makersbrain:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' \
            "$GITHUB_TOKEN" > "$RUNNER_TEMP/npmrc"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Explorer
        uses: docker/build-push-action@v6
        with:
          context: ./catalogue-explorer
          push: false
          secret-files: |
            npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Drop the npmrc
        if: always()
        run: rm -f "$RUNNER_TEMP/npmrc"
