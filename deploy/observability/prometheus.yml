global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: catalogue-control
    static_configs:
      - targets: [control:8687]

  - job_name: catalogue-service
    static_configs:
      - targets: [service:8686]

  - job_name: catalogue-dispatcher
    static_configs:
      - targets: [dispatcher:9110]

  - job_name: catalogue-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9109
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: pool
        replacement: plain

  - job_name: catalogue-worker-browser
    dns_sd_configs:
      - names: [worker-browser]
        type: A
        port: 9109
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: pool
        replacement: browser
