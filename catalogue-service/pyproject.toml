[project]
name = "ateliera-catalogue-service"
version = "1.0.0"
description = "The ceramics catalogue read API, under a generated OpenAPI contract"
requires-python = ">=3.11,<3.14"
dependencies = [
  "starlette>=0.41,<1",
  "uvicorn[standard]>=0.32,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.9,<3",
  # For the shared OpenAPI registry only; this service imports no collection code.
  "ateliera-catalogue",
]

[project.scripts]
catalogue-service = "catalogue_service.__main__:main"
catalogue-openapi = "catalogue_service.generate:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalogue_service"]

[tool.uv]
package = true

[tool.uv.sources]
ateliera-catalogue = { path = "../catalogue-dump", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not postgres'"
markers = ["postgres: needs a live PostgreSQL; skipped when CATALOGUE_TEST_DSN is unset"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE", "ASYNC"]
ignore = ["E501", "SIM108", "RUF001", "RUF002", "RUF003", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE", "B011"]

[tool.mypy]
files = ["src/catalogue_service", "tests"]
mypy_path = "src"
warn_unused_configs = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
