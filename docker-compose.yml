# Local PostgreSQL for the ceramics reference catalogue.
#
# Brings up an empty database with the `catalogue` schema already applied, so
# catalogue-dump/load_postgres.py can stream the NDJSON dumps straight into it.
# This is a development database, separate from the application stack in
# ateliera-app/deploy/docker-compose.yml, and it publishes a different port.
name: catalogue-ceramics

services:
  postgres:
    image: postgres:17-alpine
    container_name: catalogue-postgres
    # Loopback only, for a psql or a query tool on the host; nothing off this
    # machine needs to reach it. 5434 keeps it clear of the application stack
    # on 5433 and of any system PostgreSQL on 5432.
    ports:
      - "127.0.0.1:${CATALOGUE_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${CATALOGUE_DB_NAME:-ateliera}
      POSTGRES_USER: ${CATALOGUE_DB_USER:-catalogue}
      POSTGRES_PASSWORD: ${CATALOGUE_DB_PASSWORD:-catalogue}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once, in filename order, the first time the volume is empty.
      # The order is load-bearing twice over: the baseline loader rejects a v2
      # record until the migration has widened it, and the ops schema adds a
      # foreign key to `catalogue.import_runs`, which the baseline creates.
      #
      # They live under the package (src/.../storage/schema) rather than beside
      # this file so a worker can apply the same DDL from an installed
      # distribution — see `storage.db.apply_schema`.
      - ./docker/initdb/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
      - ./catalogue-dump/src/mb_ceramics_catalogue/storage/schema/catalogue-reference-schema.sql:/docker-entrypoint-initdb.d/10-catalogue-reference-schema.sql:ro
      - ./catalogue-dump/src/mb_ceramics_catalogue/storage/schema/catalogue-reference-schema-v2.sql:/docker-entrypoint-initdb.d/20-catalogue-reference-schema-v2.sql:ro
      - ./catalogue-dump/src/mb_ceramics_catalogue/storage/schema/catalogue-reference-schema-v3.sql:/docker-entrypoint-initdb.d/25-catalogue-reference-schema-v3.sql:ro
      - ./catalogue-dump/src/mb_ceramics_catalogue/storage/schema/catalogue-reference-schema-v4.sql:/docker-entrypoint-initdb.d/26-catalogue-reference-schema-v4.sql:ro
      - ./catalogue-dump/src/mb_ceramics_catalogue/storage/schema/catalogue-ops-schema.sql:/docker-entrypoint-initdb.d/30-catalogue-ops-schema.sql:ro
      # Last, and it was missing entirely: it alters `canonical_products` and
      # defines `promote_canonical_products`, which a run calls when its last
      # job lands. A database without it takes every source in and never folds
      # them into the cross-supplier identities the catalogue exists to serve.
      - ./catalogue-dump/src/mb_ceramics_catalogue/storage/schema/catalogue-canonical-promotion.sql:/docker-entrypoint-initdb.d/40-catalogue-canonical-promotion.sql:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 3s
      # initdb replays both schema files before the server accepts connections.
      start_period: 30s
      retries: 10

  # The catalogue's read API. Cross-tenant reference data served to every tenant
  # and owned by none of them, which is why it is a service in front of the
  # database rather than a connection string handed to each tenant.
  #
  # Not published on the host: the only thing that needs it is another container,
  # and it joins this stack's network to reach it.
  service:
    build:
      # The build context is the repository root: the read API installs the
      # shared OpenAPI registry from catalogue-dump as a path dependency.
      context: .
      dockerfile: catalogue-service/Dockerfile
    container_name: catalogue-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATALOGUE_DSN: postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8686/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # One-shot importer, so a load needs no `psql` on the host:
  #
  #   docker compose run --rm loader --dry-run
  #   docker compose run --rm loader --source amaco,mayco
  #
  # Arguments are appended to the entrypoint, so anything load_postgres.py
  # accepts can be passed and a repeated flag wins over the default below.
  # It is behind a profile so `docker compose up` starts the database alone.
  loader:
    profiles: ["loader"]
    build:
      # The build context is the repository root because the image installs the
      # package from catalogue-dump/, rather than reading a script off the mount.
      context: .
      dockerfile: docker/loader/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # COPY streams from this process, so the dumps have to be visible to this
      # container rather than to the server.
      - .:/work:ro
    # `catalogue-load` is a console script from the installed distribution.
    # Arguments given to `docker compose run` are appended, so a repeated flag
    # wins over the defaults below.
    command:
      - --dsn
      - postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      - --data
      - /work/catalogue-dumps-v2

  # Explicit one-shot migration for existing named volumes. PostgreSQL only
  # runs /docker-entrypoint-initdb.d on first creation, so rebuilding an image
  # is not a migration strategy.
  migrate:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATALOGUE_DSN: postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
    user: "10001:999"
    entrypoint: ["catalogue-migrate"]

  # The operator control plane: run/job/worker/source control, and the live
  # stream the /ops pages read. Deliberately not published on the host — the
  # explorer proxies it server-side with the token attached, and the token is
  # the authentication boundary rather than the network.
  control:
    build:
      context: .
      dockerfile: docker/control/Dockerfile
    container_name: catalogue-control
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATALOGUE_DSN: postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      # No default. The service refuses to start without it, because the one
      # thing worse than having no cancel-run endpoint is an unauthenticated one.
      CATALOGUE_CONTROL_TOKEN: ${CATALOGUE_CONTROL_TOKEN:?set a control token in .env}
      CATALOGUE_ARTIFACTS_DIR: /var/lib/catalogue/dumps
    volumes:
      # Comparison endpoints read immutable scrape artifacts; the control plane
      # never needs permission to alter the audit trail.
      - dumps:/var/lib/catalogue/dumps:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8687/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # The collection worker. Scale it with `docker compose up --scale worker=3`;
  # the queue does not care how many there are, and catalogue.hosts is what
  # stops three of them tripling the load on every shop.
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATALOGUE_DSN: postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      # Sources are independent and mostly waiting on someone else's network, so
      # one at a time leaves the process idle for most of a run. Two jobs on one
      # shop are still prevented by catalogue.host_leases, which is per host and
      # cross-process rather than per worker.
      CATALOGUE_JOB_SLOTS: ${CATALOGUE_JOB_SLOTS:-4}
      CATALOGUE_PROXY_ENABLED: ${CATALOGUE_PROXY_ENABLED:-false}
      CATALOGUE_PROXY_SECRET_FILE: /run/secrets/proxy-profiles.json
      CATALOGUE_PROXY_API_SECRET_FILE: /run/secrets/decodo.env
    volumes:
      # Shared, so a replay works across workers and a run's artifacts are all
      # in one place. The cache is sharded per host and the dumps are namespaced
      # <run-id>/<job-id>/, so concurrent writers never collide.
      - cache:/var/lib/catalogue/cache
      - dumps:/var/lib/catalogue/dumps
      - ./decodo.env:/run/secrets/decodo.env:ro
      - ${DECODO_PROFILE_SECRET_FILE:-/dev/null}:/run/secrets/proxy-profiles.json:ro
    restart: unless-stopped
    # SIGTERM drains: finish the current source, requeue anything unfinished,
    # mark the worker stopped. The default ten seconds is not enough to write a
    # four-thousand-record artifact.
    stop_grace_period: 150s

  # Sources that need camoufox, on a separate image so the plain worker does not
  # carry a browser. Keep four replicas so browser-backed runs can make progress
  # across independent shops concurrently.
  #
  # `deploy/quadlet/catalogue-worker-browser.container` had three settings this
  # never did, and every one of them turned out to matter here too. Between
  # 2026-08-10 and 2026-08-12 the browser-backed sources kept their request
  # counts exactly and lost two orders of magnitude of speed — toepferspass
  # rendering nine pages in 4,862 seconds — and two of them stopped finishing
  # inside their deadline at all.
  worker-browser:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker-browser
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATALOGUE_DSN: postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      # camoufox leaks across jobs. A process that has rendered a few hundred
      # pages is one that gets killed by the OOM reaper mid-write, so it is
      # recycled between jobs instead — `restart: unless-stopped` restarts it.
      CATALOGUE_MAX_JOBS: ${CATALOGUE_BROWSER_MAX_JOBS:-25}
      # One job at a time here, and up to this many pages open in the one
      # browser this process now shares between them. Stated rather than left
      # to the defaults: these two figures are what the machine's share of a
      # render is, and they should be visible next to the replica count.
      CATALOGUE_JOB_SLOTS: ${CATALOGUE_BROWSER_JOB_SLOTS:-1}
      CATALOGUE_BROWSER_PAGES: ${CATALOGUE_BROWSER_PAGES:-2}
      CATALOGUE_PROXY_ENABLED: ${CATALOGUE_PROXY_ENABLED:-false}
      CATALOGUE_PROXY_SECRET_FILE: /run/secrets/proxy-profiles.json
      CATALOGUE_PROXY_API_SECRET_FILE: /run/secrets/decodo.env
    volumes:
      - cache:/var/lib/catalogue/cache
      - dumps:/var/lib/catalogue/dumps
      - ./decodo.env:/run/secrets/decodo.env:ro
      - ${DECODO_PROFILE_SECRET_FILE:-/dev/null}:/run/secrets/proxy-profiles.json:ro
    # Docker's default is 64 MB, and camoufox needs rather more: below this it
    # renders, slowly and then not at all, rather than failing outright.
    shm_size: 512m
    # And a writable /tmp, which it wants for its profile.
    tmpfs:
      - /tmp
    restart: unless-stopped
    deploy:
      replicas: 4
    stop_grace_period: 150s

  # The catalogue explorer, including the /ops pages. Published on loopback for
  # development; behind Caddy in production, which needs `flush_interval -1` on
  # the reverse_proxy or the SSE stream arrives in blocks rather than as it is
  # written.
  explorer:
    profiles: ["ui"]
    build: ./catalogue-explorer
    container_name: catalogue-explorer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CATALOGUE_UI_PORT:-5175}:3000"
    environment:
      DATABASE_URL: postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      CATALOGUE_CONTROL_URL: http://control:8687
      CATALOGUE_CONTROL_TOKEN: ${CATALOGUE_CONTROL_TOKEN:?set a control token in .env}
    restart: unless-stopped

  # The public edge: an outbound-only connector publishing the explorer at
  # https://catalogue.dev.makersbrain.app. Nothing is published on the host and
  # no port is opened inbound — the connector dials Cloudflare, which is why
  # this can front a stack whose every other service is loopback or nothing.
  #
  # The tunnel is remotely managed (`config_src: cloudflare`), so the ingress
  # rule that maps the hostname to `http://explorer:3000` lives in the Zero
  # Trust dashboard rather than in a config file here. Changing where the
  # hostname points is an API/dashboard change, not a redeploy.
  #
  # Same profile as the explorer: there is nothing to publish without it.
  cloudflared:
    profiles: ["ui"]
    image: cloudflare/cloudflared:latest
    container_name: catalogue-cloudflared
    depends_on:
      - explorer
    # The image is distroless — no shell — so the connector token cannot be
    # read from a mounted secret file by an entrypoint wrapper. It comes in as
    # TUNNEL_TOKEN from a mode 0600 env file that is gitignored, rather than
    # from .env, so it is not sitting beside the development passwords.
    #
    #   deploy/secrets/cloudflared.env   TUNNEL_TOKEN=<connector token>
    env_file:
      - deploy/secrets/cloudflared.env
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    restart: unless-stopped
    healthcheck:
      # `ready` reports the number of live edge connections, and fails while
      # there are none — a connector that is running but has registered no
      # tunnel is exactly the failure this needs to catch.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata:
  # The recorded response cache. Not in the backup set: it is reproducible by
  # fetching, and it is hundreds of megabytes.
  cache:
  # The NDJSON artifacts. These *are* in the backup set — they are the audit
  # trail each job's recorded sha256 refers to.
  dumps:
